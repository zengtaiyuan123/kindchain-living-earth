name: KindChain handover checks
on:
  pull_request:
    paths:
      - 'handover/**'
      - '.github/workflows/handover-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test handover/check-handover.test.mjs
